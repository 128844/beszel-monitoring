version: "3.8"

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped

    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console

    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123

    volumes:
      - ./minio-data:/data

    command: server /data --console-address ":9001"

    networks:
      - monitoring-system_brezel-net  # Add this line

# Remove the networks section from here and use the external network
networks:
  monitoring-system_brezel-net:
    external: true