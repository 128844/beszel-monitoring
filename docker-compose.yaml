version: "3.8"

services:
  beszel:
    image: henrygd/beszel:latest
    container_name: beszel
    restart: unless-stopped
    ports:
      - "8080:8090"
    volumes:
      - ./data:/var/lib/brezel
      - ./config:/etc/brezel
    environment:
      BREZEL_ADMIN_USER: admin@example.com
      BREZEL_ADMIN_PASSWORD: "12345678"
      BREZEL_TIMEZONE: Asia/Dhaka
    networks:
      - brezel-net



  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: unless-stopped
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./beszel_agent_data:/var/lib/beszel-agent
      - /mnt/disk1/.beszel:/extra-filesystems/disk1:ro
      # monitor other disks / partitions by mounting a folder in /extra-filesystems
      # - /mnt/disk/.beszel:/extra-filesystems/sda1:ro
    environment:
      LISTEN: 45876
      KEY: 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOMlkWV9BVxOy7azzU9CQAtgbkknc7pALjVRcCJBPj3A'
      TOKEN: c39846d5-339f-4644-874b-2859367f702c
      HUB_URL: http://localhost:8080






  # snmp-proxy:
  #   image: brezel/snmp-proxy:latest
  #   container_name: brezel-snmp
  #   restart: unless-stopped
  #   ports:
  #     - "161:161/udp"
  #   networks:
  #     - brezel-net

networks:
  brezel-net:
    driver: bridge